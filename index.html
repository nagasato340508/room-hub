<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>Room Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 枕元に置く横長の常時表示パネル。左に時計、右に天気と予定、下にアシスタントの帯 */
:root{
  --ink:#0b0e11;      /* 背景 */
  --panel:#11161b;    /* 面 */
  --line:#1e252c;     /* 罫 */
  --fg:#e9e6de;       /* 文字 */
  --dim:#7c858d;      /* 補助文字 */
  --amber:#f2b35b;    /* アクセント（常夜灯の色） */
  --sea:#7fd3cf;      /* 聞き取り中 */
  --rain:#80a9e4;     /* 降水 */
  --f-num:"Barlow Condensed","Roboto Condensed","Noto Sans JP",sans-serif;
  --f-text:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--fg);font-family:var(--f-text);
  -webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;
  transition:filter 1.2s ease;
}
body.night{filter:brightness(.42)}
[hidden]{display:none!important}

.app{
  height:100%;display:grid;grid-template-columns:1.1fr .66fr .95fr;grid-template-rows:1fr;gap:0 24px;
  padding-block:max(12px,env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
}
.app>section{min-width:0;min-height:0}

/* 時計 */
.clock{display:flex;flex-direction:column;justify-content:center}
.time{
  font-family:var(--f-num);font-weight:200;font-variant-numeric:tabular-nums;line-height:.86;
  font-size:min(46vh,15vw);letter-spacing:-.01em;display:flex;align-items:baseline;white-space:nowrap;
}
.time .colon{opacity:.55;margin:0 .02em;position:relative;top:-.06em}
.time .sec{display:none}
.date{font-size:clamp(17px,6vh,28px);color:var(--dim);margin-top:1.6vh;letter-spacing:.04em}
.date b{color:var(--fg);font-weight:500}
.next{margin-top:2.4vh;display:flex;gap:8px;align-items:baseline;font-size:clamp(16px,5.4vh,24px);min-width:0;flex-wrap:wrap}
.next .tag{font-size:.7em;letter-spacing:.14em;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:3px;padding:2px 6px;white-space:nowrap}
.next .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
.next .eta{color:var(--dim);font-size:.85em;white-space:nowrap}

.label{font-size:13px;letter-spacing:.16em;color:var(--dim);margin-bottom:1vh}

/* 天気 */
.wxcol{display:flex;flex-direction:column;padding-top:1vh}
.wx{display:flex;align-items:center;gap:10px}
.wx .icon{width:min(16vh,60px);height:min(16vh,60px);flex:none}
.wx .icon svg{width:100%;height:100%;overflow:visible}
.wx .now{font-family:var(--f-num);font-weight:300;font-size:min(19vh,72px);line-height:1;font-variant-numeric:tabular-nums}
.wx .now small{font-size:.42em;color:var(--dim);margin-left:2px}
.cond{font-size:clamp(15px,5vh,21px);margin-top:.6vh;line-height:1.3}
.cond .hl{display:block;color:var(--dim);font-family:var(--f-num);font-size:1.12em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35}
.cond .hl b{font-weight:500;color:var(--rain)}
.hours{display:flex;flex-direction:column;gap:.4vh;margin-top:1.6vh;border-top:1px solid var(--line);padding-top:1.2vh}
.hour{display:grid;grid-template-columns:2.6em 26px 1fr auto;align-items:center;gap:6px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(16px,5.6vh,22px)}
.hour .h{color:var(--dim)}
.hour svg{width:24px;height:24px}
.hour .t{font-weight:500}
.hour .p{font-size:.85em;color:var(--rain)}

/* 予定 */
.sched{display:flex;flex-direction:column;padding-top:1vh;overflow:hidden}
.list{display:flex;flex-direction:column;gap:.7vh;overflow:hidden}
.day{font-size:13px;letter-spacing:.16em;color:var(--dim);margin-top:.6vh}
.day:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:3.1em 1fr;gap:8px;align-items:baseline;font-size:clamp(16px,5.6vh,23px);min-width:0}
.ev .when{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums;color:var(--dim);font-size:1.08em;white-space:nowrap}
.ev .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev.soon .when{color:var(--amber)}
.ev.none .ttl{color:var(--dim)}
.empty{color:var(--dim);font-size:16px;line-height:1.6}

/* アシスタントの帯 */
.bar{
  position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;min-width:0;z-index:3;
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  transition:background .3s;
}
body.talk .bar{background:var(--panel);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body:not(.talk) .talk{visibility:hidden}
.orb{
  flex:none;width:28px;height:28px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--amber) 70%,#fff) 0,var(--amber) 45%,color-mix(in srgb,var(--amber) 30%,var(--ink)) 100%);
  opacity:.35;transition:opacity .4s,transform .4s,background .4s;
}
.orb:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
body[data-state="idle"] .orb{opacity:.4}
body.talk .orb{width:40px;height:40px}
body[data-state="awake"] .orb{opacity:1;background:radial-gradient(circle at 40% 35%,#fff 0,var(--sea) 45%,color-mix(in srgb,var(--sea) 25%,var(--ink)) 100%);animation:breathe 1.4s ease-in-out infinite}
body[data-state="thinking"] .orb{opacity:1;animation:spinpulse 1s linear infinite}
body[data-state="speaking"] .orb{opacity:1;animation:breathe .7s ease-in-out infinite}
body[data-state="error"] .orb{opacity:.8;background:#c96a5a}
@keyframes breathe{50%{transform:scale(1.18)}}
@keyframes spinpulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
.talk{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.status{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.said{font-size:clamp(17px,6vh,24px);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.said .q{color:var(--dim)}
.gear{flex:none;background:none;border:0;color:var(--dim);opacity:.6;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.gear:focus-visible{outline:2px solid var(--fg)}

/* 起動・設定 */
.cover{
  position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 92%,transparent);display:flex;align-items:center;justify-content:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));z-index:5;
}
.start{background:none;border:1px solid var(--amber);color:var(--fg);font:inherit;font-size:18px;padding:16px 30px;border-radius:40px;cursor:pointer;letter-spacing:.08em}
.start:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:17px;font-weight:700}
.sheet p{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.sheet label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.sheet input{background:var(--ink);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:14px;padding:9px 10px;border-radius:6px;width:100%}
.sheet input:focus{outline:none;border-color:var(--amber)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{background:var(--line);color:var(--fg);border:0;font:inherit;font-size:14px;padding:9px 16px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--amber);color:#1a1206;font-weight:700}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.msg{font-size:13px;min-height:1.2em}
.sheet label.check{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
.sheet label.check input{width:20px;height:20px;accent-color:var(--amber)}
.sheet label.check span{flex-basis:100%;font-size:12px;color:var(--dim);line-height:1.5}

@media (orientation:portrait){
  .app{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
  .clock{grid-column:1/-1}
  .time{font-size:26vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-state="off">
<main class="app">
  <section class="clock" aria-label="時刻">
    <div class="time" id="time" aria-live="off"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="sec" id="ss"></span></div>
    <div class="date" id="date"></div>
    <div class="next" id="next" hidden><span class="tag">次の予定</span><span class="what" id="nextWhat"></span><span class="eta" id="nextEta"></span></div>
  </section>

  <section class="wxcol" aria-label="天気">
    <div class="label" id="wxLabel">天気</div>
    <div class="wx">
      <div class="icon" id="wxIcon"></div>
      <div class="now" id="wxNow">--<small>°C</small></div>
    </div>
    <div class="cond" id="wxCond">取得中…</div>
    <div class="hours" id="hours"></div>
  </section>

  <section class="sched" aria-label="予定">
    <div class="label">予定</div>
    <div class="list" id="events"><div class="empty">読み込み中…</div></div>
  </section>

  <section class="bar">
    <button class="orb" id="orb" aria-label="話しかける"></button>
    <div class="talk">
      <div class="status" id="status"></div>
      <div class="said" id="said"></div>
    </div>
    <button class="gear" id="gearBtn" aria-label="設定">⚙</button>
  </section>
</main>

<div class="cover" id="startCover">
  <button class="start" id="startBtn">タップして起動</button>
</div>

<div class="cover" id="settings" hidden>
  <form class="sheet" id="settingsForm">
    <h2>連携の設定</h2>
    <p>Apps Scriptの「ウェブアプリのURL」と合言葉、天気を出す場所を入れてください。どれもこの端末のブラウザにだけ保存され、公開されるファイルには入りません。</p>
    <label>ウェブアプリのURL<input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>合言葉（TOKEN）<input id="gasToken" type="text" autocomplete="off" spellcheck="false"></label>
    <label>天気を出す場所の名前<input id="placeName" type="text" placeholder="例：自宅" autocomplete="off"></label>
    <div class="row" style="justify-content:stretch">
      <label style="flex:1">緯度<input id="placeLat" type="text" inputmode="decimal" placeholder="35.68" autocomplete="off"></label>
      <label style="flex:1">経度<input id="placeLon" type="text" inputmode="decimal" placeholder="139.77" autocomplete="off"></label>
    </div>
    <label class="check"><input id="wakeOn" type="checkbox"> 「ジェミニ」の呼びかけで起動する<span>オフにすると左下の丸をタップして話します。オンのままだと、聞き直すたびにピコン音が鳴ることがあります。</span></label>
    <div class="msg" id="settingsMsg"></div>
    <div class="row">
      <button type="button" class="btn" id="testBtn">接続テスト</button>
      <button type="button" class="btn" id="closeBtn">閉じる</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<script>
(() => {
  "use strict";
  const CFG_KEY = "roomhub.cfg";
  const $ = (id) => document.getElementById(id);

  /* ---------- 設定 ---------- */
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { cfg = {}; }
  const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };
  (() => { // ?gas=...&token=... で一度だけ取り込めるようにする
    const q = new URLSearchParams(location.search);
    if (q.get("gas")) { cfg.gas = q.get("gas"); cfg.token = q.get("token") || ""; saveCfg(); history.replaceState(null, "", location.pathname); }
  })();
  const linked = () => !!(cfg.gas && cfg.token);
  const wakeMode = () => cfg.wake !== false;
  const hasPlace = () => Number.isFinite(cfg.lat) && Number.isFinite(cfg.lon);
  const placeName = () => cfg.place || "現在地";

  /* ---------- 時計 ---------- */
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const pad = (n) => String(n).padStart(2, "0");
  const fmtHM = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  function tick() {
    const d = new Date();
    $("hh").textContent = pad(d.getHours());
    $("mm").textContent = pad(d.getMinutes());
    $("ss").textContent = pad(d.getSeconds());
    $("date").innerHTML = `${d.getMonth() + 1}月${d.getDate()}日 <b>${WD[d.getDay()]}曜日</b>`;
    const h = d.getHours();
    document.body.classList.toggle("night", h >= 23 || h < 6);
    if (d.getSeconds() === 0) renderEvents();
  }
  setInterval(tick, 1000); tick();

  /* ---------- 天気（Open-Meteo） ---------- */
  const WMO = {0:"快晴",1:"晴れ",2:"晴れ時々くもり",3:"くもり",45:"霧",48:"霧",51:"霧雨",53:"霧雨",55:"霧雨",56:"着氷性の霧雨",57:"着氷性の霧雨",
    61:"小雨",63:"雨",65:"強い雨",66:"着氷性の雨",67:"着氷性の雨",71:"小雪",73:"雪",75:"大雪",77:"霧雪",80:"にわか雨",81:"にわか雨",82:"激しいにわか雨",85:"にわか雪",86:"にわか雪",95:"雷雨",96:"雷雨とひょう",99:"雷雨とひょう"};
  const kind = (c) => c <= 1 ? "sun" : c === 2 ? "part" : c === 3 ? "cloud" : c <= 48 ? "fog" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "snow" : c >= 95 ? "storm" : "rain";
  const S = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  const CLOUD = '<path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.1 9.6 4.2 4.2 0 0 0 7 18z"/>';
  function icon(c, night) {
    const k = kind(c);
    const sun = night ? '<path d="M15.5 4.5a6.5 6.5 0 1 0 4 11.6A7 7 0 0 1 15.5 4.5z" stroke="var(--amber)"/>'
      : '<circle cx="12" cy="12" r="4" stroke="var(--amber)"/><path stroke="var(--amber)" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
    let body;
    if (k === "sun") body = sun;
    else if (k === "part") body = `<g transform="translate(-1 -1) scale(.7)">${sun}</g><g transform="translate(2 2) scale(.85)">${CLOUD}</g>`;
    else if (k === "cloud") body = CLOUD;
    else if (k === "fog") body = '<path d="M4 9h16M6 13h12M4 17h16"/>';
    else if (k === "snow") body = `<g transform="translate(0 -3)">${CLOUD}</g><path d="M8 19.5h.01M12 21h.01M16 19.5h.01" stroke-width="2.4"/>`;
    else if (k === "storm") body = `<g transform="translate(0 -3)">${CLOUD}</g><path stroke="var(--amber)" d="M12.5 16l-2 3h3l-2 3"/>`;
    else body = `<g transform="translate(0 -3)">${CLOUD}</g><path stroke="var(--rain)" d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/>`;
    return `<svg viewBox="0 0 24 24" ${S}>${body}</svg>`;
  }
  let wx = null;
  async function loadWeather() {
    $("wxLabel").textContent = hasPlace() ? `${placeName()}の天気` : "天気";
    if (!hasPlace()) { wx = null; $("wxIcon").innerHTML = ""; $("wxNow").innerHTML = "--<small>°C</small>"; $("hours").innerHTML = ""; $("wxCond").textContent = "右下の ⚙ で場所を設定すると表示されます"; return; }
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat.toFixed(2)}&longitude=${cfg.lon.toFixed(2)}` +
      "&current=temperature_2m,apparent_temperature,weather_code,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Asia%2FTokyo&forecast_days=2";
    try {
      const r = await fetch(url); if (!r.ok) throw new Error(r.status);
      wx = await r.json(); renderWeather();
    } catch (e) { if (!wx) $("wxCond").textContent = "天気を取得できませんでした"; }
  }
  function renderWeather() {
    const c = wx.current, d = wx.daily;
    $("wxIcon").innerHTML = icon(c.weather_code, !c.is_day);
    $("wxNow").innerHTML = `${Math.round(c.temperature_2m)}<small>°C</small>`;
    $("wxCond").innerHTML = `${WMO[c.weather_code] || ""}<span class="hl">${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</span><span class="hl">降水 <b>${d.precipitation_probability_max[0] ?? "-"}%</b></span>`;
    const nowKey = c.time.slice(0, 13);
    let i = wx.hourly.time.findIndex((t) => t.slice(0, 13) === nowKey); if (i < 0) i = 0;
    let html = "";
    for (let k = 1; k <= 3; k++) {
      const j = i + k * 3; if (j >= wx.hourly.time.length) break;
      const h = Number(wx.hourly.time[j].slice(11, 13));
      html += `<div class="hour"><span class="h">${h}時</span>${icon(wx.hourly.weather_code[j], h >= 18 || h < 6)}<span class="t">${Math.round(wx.hourly.temperature_2m[j])}°</span><span class="p">${wx.hourly.precipitation_probability[j] ?? 0}%</span></div>`;
    }
    $("hours").innerHTML = html;
  }
  function weatherText() {
    if (!wx) return "天気: 取得できていません";
    const c = wx.current, d = wx.daily;
    return `天気(${placeName()}): 現在${WMO[c.weather_code]}、${Math.round(c.temperature_2m)}℃（体感${Math.round(c.apparent_temperature)}℃）。` +
      `今日の最高${Math.round(d.temperature_2m_max[0])}℃/最低${Math.round(d.temperature_2m_min[0])}℃、降水確率${d.precipitation_probability_max[0]}%。` +
      `明日は${WMO[d.weather_code[1]]}、最高${Math.round(d.temperature_2m_max[1])}℃/最低${Math.round(d.temperature_2m_min[1])}℃、降水確率${d.precipitation_probability_max[1]}%。`;
  }
  loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- 予定（Apps Script経由のGoogleカレンダー） ---------- */
  let events = null, evError = "";
  async function loadEvents() {
    if (!linked()) { events = null; renderEvents(); return; }
    try {
      const r = await fetch(`${cfg.gas}?action=events&days=2&token=${encodeURIComponent(cfg.token)}`);
      const j = await r.json();
      if (j.error) throw new Error(j.error === "token" ? "合言葉が違います" : j.error);
      events = j.events.map((e) => ({ ...e, s: new Date(e.start), e: new Date(e.end) })); evError = "";
    } catch (e) { evError = String(e.message || e); }
    renderEvents();
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  function renderEvents() {
    const box = $("events");
    if (!linked()) { box.innerHTML = '<div class="empty">Googleカレンダーはまだ未連携です。右下の ⚙ から設定できます。</div>'; $("next").hidden = true; return; }
    if (!events) { box.innerHTML = `<div class="empty">${evError ? "予定を取得できませんでした（" + esc(evError) + "）" : "読み込み中…"}</div>`; return; }
    const now = new Date(), tmr = new Date(now); tmr.setDate(now.getDate() + 1);
    const live = events.filter((e) => e.allDay ? e.e > now : e.e > now);
    const groups = [["今日", live.filter((e) => e.allDay ? e.s <= now : sameDay(e.s, now) || e.s < now)], ["明日", live.filter((e) => sameDay(e.s, tmr) && !(e.allDay && e.s <= now))]];
    let html = "", count = 0;
    for (const [name, list] of groups) {
      html += `<div class="day">${name}</div>`;
      if (!list.length) { html += '<div class="ev none"><span class="when">—</span><span class="ttl">予定なし</span></div>'; continue; }
      for (const e of list) {
        if (count++ >= 6) break;
        const soon = !e.allDay && e.s > now && e.s - now < 60 * 60 * 1000;
        const when = e.allDay ? "終日" : e.s <= now ? "進行中" : fmtHM(e.s);
        html += `<div class="ev${soon ? " soon" : ""}"><span class="when">${when}</span><span class="ttl">${esc(e.title || "（無題）")}</span></div>`;
      }
    }
    box.innerHTML = html;
    const nx = live.find((e) => !e.allDay && e.s > now && e.s - now < 12 * 3600 * 1000);
    if (nx) {
      const m = Math.round((nx.s - now) / 60000);
      $("nextWhat").textContent = `${fmtHM(nx.s)} ${nx.title || "（無題）"}`;
      $("nextEta").textContent = m >= 60 ? `あと${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}` : `あと${m}分`;
      $("next").hidden = false;
    } else $("next").hidden = true;
  }
  function eventsText() {
    if (!events) return "予定: 取得できていません";
    const now = new Date();
    const lines = events.filter((e) => e.e > now).slice(0, 12).map((e) => {
      const d = `${e.s.getMonth() + 1}/${e.s.getDate()}(${WD[e.s.getDay()]})`;
      return `- ${d} ${e.allDay ? "終日" : fmtHM(e.s) + "〜" + fmtHM(e.e)} ${e.title}`;
    });
    return "今日と明日の予定:\n" + (lines.join("\n") || "- なし");
  }
  loadEvents(); setInterval(loadEvents, 5 * 60 * 1000);

  /* ---------- アシスタント ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let state = "off", awakeTimer = 0, chat = [], lastTalk = 0;
  function setState(s, text) {
    state = s; document.body.dataset.state = s; clearTimeout(awakeTimer);
    const msg = { idle: "", awake: "どうぞ、聞いています", thinking: "考えています…", speaking: "", error: "" }[s];
    $("status").textContent = text ?? msg ?? "";
    updateTalk();
    if (s === "awake") awakeTimer = setTimeout(() => { if (state === "awake") setState("idle"); }, 8000);
    if (s === "idle") { if (wakeMode()) listen(); else mute(); }
  }
  let saidTimer = 0, saidOn = false;
  function showSaid(q, a) {
    $("said").innerHTML = (q ? `<span class="q">${esc(q)}　</span>` : "") + esc(a || "");
    saidOn = true; clearTimeout(saidTimer);
    saidTimer = setTimeout(() => { saidOn = false; $("said").textContent = ""; updateTalk(); }, 45000);
    updateTalk();
  }
  function updateTalk() {
    document.body.classList.toggle("talk", ["awake", "thinking", "speaking", "error"].includes(state) || saidOn);
  }

  let rec = null, recWanted = false, recRunning = false;
  function makeRec() {
    rec = new SR(); rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    rec.onstart = () => { recRunning = true; };
    rec.onend = () => { recRunning = false; if (recWanted) setTimeout(startRec, 250); };
    rec.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        recWanted = false; setState("error", "マイクが使えません。Chromeのサイト設定でマイクを許可してください");
      }
    };
    rec.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) onFinal(t); else onInterim(t);
      }
    };
  }
  function startRec() { if (!rec || !recWanted || recRunning || document.hidden) return; try { rec.start(); } catch (e) {} }
  function listen() { recWanted = true; startRec(); }
  function mute() { recWanted = false; try { rec && rec.abort(); } catch (e) {} }

  const WAKE = /(ジェミニ[ー〜]?|ジェミナイ|じぇみに|gemini|ジェミ二)[さんちゃん]*[、。,!！?？\s]*/i;
  const norm = (t) => t.trim().replace(/\s+/g, " ");
  function onInterim(t) {
    if (state === "awake") $("status").textContent = norm(t);
  }
  function onFinal(raw) {
    const t = norm(raw); if (!t) return;
    if (state === "awake") { ask(t); return; }
    if (state !== "idle") return;
    const m = t.match(WAKE);
    if (!m || m.index > 4) return;
    const rest = t.slice(m.index + m[0].length).trim();
    if (rest.length >= 2) ask(rest); else { chime(); setState("awake"); }
  }

  let actx = null;
  function chime() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = "sine"; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + .09);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + .3);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .32);
    } catch (e) {}
  }

  function context() {
    const d = new Date();
    return `現在日時: ${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]}) ${fmtHM(d)}\n` +
      (cfg.place ? `場所: ${cfg.place}\n` : "") + `${weatherText()}\n${eventsText()}`;
  }
  async function ask(q) {
    mute(); setState("thinking"); showSaid(q, "");
    if (Date.now() - lastTalk > 3 * 60 * 1000) chat = [];
    chat.push({ role: "user", text: q });
    let answer, detail = "";
    if (!linked()) answer = "まだAIの連携が設定されていません。右下の歯車から設定してください。";
    else {
      try {
        const r = await fetch(cfg.gas, { method: "POST", body: JSON.stringify({ token: cfg.token, messages: chat.slice(-10), context: context() }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        answer = j.text;
      } catch (e) { answer = "すみません、AIにつながりませんでした。"; detail = explain(e); console.error(e); }
    }
    chat.push({ role: "assistant", text: answer }); lastTalk = Date.now();
    showSaid(q, answer + (detail ? `（${detail}）` : ""));
    speak(answer);
  }

  function explain(e) {
    const m = String((e && e.message) || e);
    if (/token/i.test(m) && m.length < 10) return "合言葉が違います";
    if (/GEMINI_API_KEY/.test(m)) return "Apps ScriptにGEMINI_API_KEYが設定されていません";
    if (/JSON|Unexpected token|<!DOCTYPE/i.test(m)) return "Apps Scriptの返事が読めません。アクセスできるユーザーが「全員」か、新バージョンでデプロイしたか確認してください";
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Apps Scriptに届きませんでした";
    return m.slice(0, 160);
  }

  let jaVoice = null;
  function pickVoice() { const v = speechSynthesis.getVoices(); jaVoice = v.find((x) => /ja[-_]JP/i.test(x.lang)) || null; }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    const clean = text.replace(/[*#`_>|]/g, "").replace(/\n+/g, "。");
    if (!("speechSynthesis" in window)) { afterSpeak(); return; }
    setState("speaking", "");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = 1.05;
    u.onend = u.onerror = afterSpeak;
    speechSynthesis.speak(u);
  }
  function afterSpeak() {
    if (state !== "speaking" && state !== "thinking") return;
    if (wakeMode()) { setState("awake", "続けてどうぞ（呼びかけなしでOK）"); listen(); }
    else setState("idle");
  }

  /* ---------- 起動 ---------- */
  let wakeLock = null;
  async function keepAwake() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { keepAwake(); if (state !== "off") startRec(); loadWeather(); loadEvents(); }
  });

  $("startBtn").addEventListener("click", async () => {
    $("startCover").hidden = true;
    keepAwake();
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }
    if (!SR) { setState("error", "このブラウザは音声認識に対応していません。Chromeで開いてください"); return; }
    makeRec(); setState("idle");
  });

  $("orb").addEventListener("click", () => {
    if (state === "off") { $("startBtn").click(); return; }
    if (state === "speaking") { speechSynthesis.cancel(); return; }
    if (state === "idle" || state === "error") { if (wakeMode()) chime(); setState("awake"); listen(); }
  });

  /* ---------- 設定画面 ---------- */
  const openSettings = () => { $("gasUrl").value = cfg.gas || ""; $("gasToken").value = cfg.token || ""; $("placeName").value = cfg.place || ""; $("placeLat").value = hasPlace() ? cfg.lat : ""; $("placeLon").value = hasPlace() ? cfg.lon : ""; $("wakeOn").checked = wakeMode(); $("settingsMsg").textContent = ""; $("settings").hidden = false; };
  $("gearBtn").addEventListener("click", openSettings);
  $("closeBtn").addEventListener("click", () => { $("settings").hidden = true; });
  $("settingsForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    cfg.gas = $("gasUrl").value.trim(); cfg.token = $("gasToken").value.trim();
    cfg.place = $("placeName").value.trim();
    cfg.wake = $("wakeOn").checked;
    const la = parseFloat($("placeLat").value), lo = parseFloat($("placeLon").value);
    if (Number.isFinite(la) && Number.isFinite(lo)) { cfg.lat = la; cfg.lon = lo; } else { delete cfg.lat; delete cfg.lon; }
    saveCfg();
    $("settings").hidden = true; loadEvents(); loadWeather();
    if (state === "idle") setState("idle");
  });
  $("testBtn").addEventListener("click", async () => {
    const url = $("gasUrl").value.trim(), tok = $("gasToken").value.trim(), m = $("settingsMsg");
    if (!url || !tok) { m.textContent = "URLと合言葉の両方を入れてください"; return; }
    m.textContent = "確認中…";
    try {
      const j = await (await fetch(`${url}?action=events&days=2&token=${encodeURIComponent(tok)}`)).json();
      m.textContent = j.error ? (j.error === "token" ? "合言葉が違います" : "エラー: " + j.error) : `つながりました。今日と明日の予定が${j.events.length}件あります`;
    } catch (e) { m.textContent = "つながりませんでした。URLと、デプロイのアクセス権が「全員」になっているか確認してください"; }
  });
})();
</script>
</body>
</html>
